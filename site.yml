---
- name: Harden Linux servers (Ubuntu/Debian primary, RHEL-family supported)
  hosts: all
  become: true
  roles:
    - { role: common, tags: [common] }
    - { role: users, tags: [users] }
    - { role: ssh_hardening, tags: [ssh_hardening] }
    - { role: firewall, tags: [firewall] }
    - { role: fail2ban, tags: [fail2ban] }
    - { role: sysctl_hardening, tags: [sysctl] }
    - { role: auto_updates, tags: [updates] }
    - { role: auditd, tags: [auditd] }
