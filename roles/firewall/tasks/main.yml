---
- name: Configure UFW (Debian family)
  when: ansible_os_family == "Debian"
  block:
    - name: Install ufw
      ansible.builtin.apt: { name: ufw, state: present }
    - name: Default deny incoming
      community.general.ufw: { default: deny, direction: incoming }
    - name: Default allow outgoing
      community.general.ufw: { default: allow, direction: outgoing }
    - name: Allow required ports
      community.general.ufw: { rule: allow, port: "{{ item }}", proto: tcp }
      loop: "{{ firewall_allowed_tcp_ports }}"
    - name: Rate-limit SSH
      community.general.ufw: { rule: limit, port: "{{ ssh_port }}", proto: tcp }
    - name: Enable ufw
      community.general.ufw: { state: enabled }
- name: Configure firewalld (RedHat family)
  when: ansible_os_family == "RedHat"
  block:
    - name: Install firewalld
      ansible.builtin.dnf: { name: firewalld, state: present }
    - name: Start firewalld
      ansible.builtin.service: { name: firewalld, state: started, enabled: true }
    - name: Allow required ports
      ansible.posix.firewalld: { port: "{{ item }}/tcp", permanent: true, immediate: true, state: enabled }
      loop: "{{ firewall_allowed_tcp_ports }}"
